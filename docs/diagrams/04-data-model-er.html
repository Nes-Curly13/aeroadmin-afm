<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AeroAdmin AFM — Data Model (PostGIS)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:        #f0f4f1;
      --paper-2:      #e6ede8;
      --ink:          #1a2e22;
      --muted:        #4f5d75;
      --soft:         #7a8399;
      --rule:         rgba(26,46,34,0.12);
      --rule-solid:   #d2ddd6;
      --accent:       #0b5f2d;
      --accent-tint:  rgba(11,95,45,0.08);
      --link:         #2e5aa8;
      --concern:      #a93232;
    }
    html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      padding: 40px 32px 56px;
      max-width: 1280px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 1.75rem;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft);
    }
    .legend {
      margin-top: 24px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      border-top: 1px solid var(--rule);
      padding-top: 16px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .swatch {
      width: 18px; height: 10px; border-radius: 2px;
      border: 1px solid var(--ink);
    }
    .swatch--entity  { background: #ffffff; border-color: var(--ink); }
    .swatch--focal   { background: var(--accent-tint); border-color: var(--accent); border-width: 1.2px; }
  </style>
</head>
<body>
  <h1>Data Model — PostGIS (5 tablas núcleo)</h1>
  <p class="subtitle">El aggregate root es <code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">dji_parcels</code> — todo converge ahí. <code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">djiag_health</code> es singleton (no se relaciona con las otras).</p>

  <svg viewBox="0 0 1240 720" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="er-title er-desc">
    <title id="er-title">AeroAdmin AFM — Data Model</title>
    <desc id="er-desc">
      Cinco tablas de Postgres+PostGIS. dji_parcels (focal, aggregate root) tiene
      relación 1:N con dji_flights, 1:N con dji_fumigations, y 1:1 con
      dji_fumigation_schedule. djiag_health es singleton sin FKs.
      PKs marcados con #, FKs con →.
    </desc>

    <defs>
      <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f0f4f1"/>

    <!-- ============================================================ -->
    <!-- RELATIONSHIPS (drawn before entities)                          -->
    <!-- ============================================================ -->
    <!-- dji_parcels (right edge) -> dji_flights (left edge): 1:N -->
    <!-- parcels right: x=380, y=170 (mid of top-right area) -->
    <!-- flights left: x=560, y=130 (mid of top-left area) -->
    <path d="M 380,170 H 460 Q 470,170 470,160 V 130 H 558" fill="none"
          stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>
    <rect x="420" y="148" width="40" height="12" rx="2" fill="#f0f4f1"/>
    <text x="440" y="158" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1..N</text>

    <!-- dji_parcels -> dji_fumigations: 1:N -->
    <!-- parcels right: x=380, y=270 (mid of middle-right) -->
    <!-- fumigations left: x=900, y=130 -->
    <path d="M 380,270 H 880 Q 890,270 890,260 V 130 H 898" fill="none"
          stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>
    <rect x="620" y="248" width="40" height="12" rx="2" fill="#f0f4f1"/>
    <text x="640" y="258" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1..N</text>

    <!-- dji_parcels -> dji_fumigation_schedule: 1:1 -->
    <!-- parcels right: x=380, y=420 (mid of bottom-right) -->
    <!-- schedule left: x=560, y=520 (top-left) -->
    <path d="M 380,420 H 460 Q 470,420 470,430 V 520 H 558" fill="none"
          stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>
    <rect x="420" y="468" width="40" height="12" rx="2" fill="#f0f4f1"/>
    <text x="440" y="478" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1..1</text>

    <!-- ============================================================ -->
    <!-- ENTITIES                                                      -->
    <!-- ============================================================ -->

    <!-- dji_parcels (FOCAL) -->
    <rect x="60" y="60" width="320" height="380" rx="6"
          fill="rgba(11,95,45,0.08)" stroke="#0b5f2d" stroke-width="1.4"/>
    <rect x="68" y="68" width="48" height="12" rx="2" fill="transparent" stroke="rgba(11,95,45,0.55)" stroke-width="0.8"/>
    <text x="92" y="77" fill="#0b5f2d" font-size="7" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="220" y="100" fill="#0b5f2d" font-size="14" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">dji_parcels</text>
    <line x1="80" y1="115" x2="360" y2="115" stroke="rgba(11,95,45,0.30)" stroke-width="0.5"/>

    <text x="76" y="138" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace"># id            bigserial</text>
    <text x="76" y="156" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  land_name     text</text>
    <text x="76" y="174" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  external_id   text</text>
    <text x="76" y="192" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  field_type    text</text>
    <text x="76" y="210" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  declared_area_ha numeric</text>
    <text x="76" y="228" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  spray_area_m2 numeric</text>
    <text x="76" y="246" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  spray_geom    geometry(MultiPolygon 4326)</text>
    <text x="76" y="264" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  reference_point geometry(Point 4326)</text>
    <text x="76" y="282" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  waypoints     geometry(MultiPoint 4326)</text>
    <text x="76" y="300" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  is_orchard    boolean</text>
    <text x="76" y="318" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  drone_model_code int</text>
    <text x="76" y="336" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  planting_date date NULL</text>
    <text x="76" y="354" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  supervisor_notes text</text>
    <text x="76" y="372" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  deleted_at    timestamptz NULL</text>
    <text x="76" y="390" fill="#0b5f2d" font-size="9" font-style="italic"
          font-family="'Geist Mono', monospace">~1207 filas · corazón del mapa</text>
    <text x="76" y="410" fill="#0b5f2d" font-size="9" font-style="italic"
          font-family="'Geist Mono', monospace">write: pipeline UPSERT</text>
    <text x="76" y="430" fill="#0b5f2d" font-size="9" font-style="italic"
          font-family="'Geist Mono', monospace">read: V0 adapter + map</text>

    <!-- dji_flights -->
    <rect x="560" y="60" width="320" height="140" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="1"/>
    <rect x="568" y="68" width="48" height="12" rx="2" fill="transparent" stroke="rgba(26,46,34,0.40)" stroke-width="0.8"/>
    <text x="592" y="77" fill="rgba(26,46,34,0.80)" font-size="7"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="720" y="100" fill="#1a2e22" font-size="14" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">dji_flights</text>
    <line x1="580" y1="115" x2="860" y2="115" stroke="rgba(26,46,34,0.12)" stroke-width="0.5"/>

    <text x="576" y="138" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace"># id            bigserial</text>
    <text x="576" y="156" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">→ parcel_id     bigint NULL</text>
    <text x="576" y="174" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  drone_serial  text</text>
    <text x="588" y="192" fill="#7a8399" font-size="8" font-style="italic"
          font-family="'Geist Mono', monospace">~16,353 filas</text>

    <!-- dji_fumigations -->
    <rect x="900" y="60" width="320" height="140" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="1"/>
    <rect x="908" y="68" width="48" height="12" rx="2" fill="transparent" stroke="rgba(26,46,34,0.40)" stroke-width="0.8"/>
    <text x="932" y="77" fill="rgba(26,46,34,0.80)" font-size="7"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="1060" y="100" fill="#1a2e22" font-size="14" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">dji_fumigations</text>
    <line x1="920" y1="115" x2="1200" y2="115" stroke="rgba(26,46,34,0.12)" stroke-width="0.5"/>

    <text x="916" y="138" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace"># id            bigserial</text>
    <text x="916" y="156" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">→ parcel_id     bigint NULL</text>
    <text x="916" y="174" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  product_used  text</text>
    <text x="916" y="192" fill="#7a8399" font-size="8" font-style="italic"
          font-family="'Geist Mono', monospace">~642 filas · manual + dji_aggr</text>

    <!-- dji_fumigation_schedule -->
    <rect x="560" y="520" width="320" height="160" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="1"/>
    <rect x="568" y="528" width="48" height="12" rx="2" fill="transparent" stroke="rgba(26,46,34,0.40)" stroke-width="0.8"/>
    <text x="592" y="537" fill="rgba(26,46,34,0.80)" font-size="7"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="720" y="560" fill="#1a2e22" font-size="14" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">dji_fumigation_schedule</text>
    <line x1="580" y1="575" x2="860" y2="575" stroke="rgba(26,46,34,0.12)" stroke-width="0.5"/>

    <text x="576" y="598" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace"># parcel_id     bigint (PK + FK)</text>
    <text x="576" y="616" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  recommended_cadence_days int</text>
    <text x="576" y="634" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  last_fumigation_date date</text>
    <text x="576" y="652" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  next_due_date date</text>
    <text x="576" y="670" fill="#7a8399" font-size="8" font-style="italic"
          font-family="'Geist Mono', monospace">1:1 con dji_parcels</text>

    <!-- djiag_health (singleton) -->
    <rect x="900" y="520" width="320" height="160" rx="6"
          fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <rect x="908" y="528" width="48" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
    <text x="932" y="537" fill="rgba(122,131,153,0.90)" font-size="7"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SINGLETON</text>
    <text x="1060" y="560" fill="#1a2e22" font-size="14" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">djiag_health</text>
    <line x1="920" y1="575" x2="1200" y2="575" stroke="rgba(26,46,34,0.12)" stroke-width="0.5"/>

    <text x="916" y="598" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace"># id            int (=1)</text>
    <text x="916" y="616" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  status        text</text>
    <text x="916" y="634" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  last_run_at   timestamptz</text>
    <text x="916" y="652" fill="#1a2e22" font-size="10"
          font-family="'Geist Mono', monospace">  last_successful_sync_at timestamptz</text>
    <text x="916" y="670" fill="#7a8399" font-size="8" font-style="italic"
          font-family="'Geist Mono', monospace">write: run-pipeline · read: SyncBanner</text>

    <!-- Editorial callout -->
    <text x="600" y="40" fill="#7a8399" font-size="9" font-style="italic"
          font-family="'Instrument Serif', serif" text-anchor="middle">
      Cardinalidades: <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">1..N</tspan> = una parcela, muchos registros (flights, fumigations). <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">1..1</tspan> = una fila de schedule por parcela. <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">SINGLETON</tspan> = una sola fila total.
    </text>
  </svg>

  <div class="legend">
    <span class="eyebrow" style="margin-right: 8px;">Leyenda</span>
    <div class="legend-item"><span class="swatch swatch--entity"></span> Entidad</div>
    <div class="legend-item"><span class="swatch swatch--focal"></span> Entidad focal · aggregate root</div>
    <div class="legend-item"><code style="font-family:'Geist Mono',monospace;font-size:10px">#</code> PK &nbsp; <code style="font-family:'Geist Mono',monospace;font-size:10px">→</code> FK</div>
  </div>
</body>
</html>
