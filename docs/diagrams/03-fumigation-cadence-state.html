<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AeroAdmin AFM — Fumigation Cadence State Machine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:        #f0f4f1;
      --paper-2:      #e6ede8;
      --ink:          #1a2e22;
      --muted:        #4f5d75;
      --soft:         #7a8399;
      --rule:         rgba(26,46,34,0.12);
      --rule-solid:   #d2ddd6;
      --accent:       #0b5f2d;
      --accent-tint:  rgba(11,95,45,0.08);
      --link:         #2e5aa8;
      --concern:      #a93232;
    }
    html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      padding: 40px 32px 56px;
      max-width: 1280px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 1.75rem;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft);
    }
    .legend {
      margin-top: 24px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      border-top: 1px solid var(--rule);
      padding-top: 16px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .swatch {
      width: 18px; height: 10px; border-radius: 2px;
      border: 1px solid var(--ink);
    }
    .swatch--state  { background: rgba(26,46,34,0.05); border-color: var(--ink); }
    .swatch--focal  { background: rgba(169,50,50,0.08); border-color: var(--concern); border-width: 1.2px; }
  </style>
</head>
<body>
  <h1>Fumigation Cadence — State Machine</h1>
  <p class="subtitle">Lógica de <code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">lib/fumigation-cadence.ts</code>. El tiempo empuja hacia la derecha; una nueva fumigación resetea a <code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">ok</code>.</p>

  <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="state-title state-desc">
    <title id="state-title">AeroAdmin AFM — Fumigation Cadence State Machine</title>
    <desc id="state-desc">
      Cuatro estados en fila (no_history, ok, due_soon, overdue) con el tiempo
      como transición forward. Una fumigación nueva resetea a ok desde cualquier
      estado (la flecha de recovery focal). El estado overdue es el focal
      (concern red); la flecha de recovery usa el accent verde.
    </desc>

    <defs>
      <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0b5f2d"/>
      </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f0f4f1"/>

    <!-- ============================================================ -->
    <!-- CURVED TRANSITIONS (drawn before states)                      -->
    <!-- ============================================================ -->

    <!-- Recovery arc: overdue (top edge x=900, y=260) -> ok (top edge x=400, y=260) -->
    <!-- C 900,140 400,140 400,260 (a big bezier going up and over) -->
    <path d="M 900,260 C 900,140 400,140 400,260" fill="none"
          stroke="#0b5f2d" stroke-width="1.6" marker-end="url(#arr-accent)"/>
    <!-- Mask + label for the recovery arc, centered above the curve -->
    <rect x="565" y="155" width="170" height="20" rx="3" fill="#f0f4f1"/>
    <text x="650" y="167" fill="#0b5f2d" font-size="10" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">new fumigation</text>
    <text x="650" y="180" fill="#0b5f2d" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RESET TO OK</text>

    <!-- ============================================================ -->
    <!-- IN-ROW TRANSITIONS (short horizontal arrows)                  -->
    <!-- ============================================================ -->
    <!-- start dot -> no_history (small) -->
    <line x1="76" y1="295" x2="118" y2="295" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>

    <!-- no_history -> ok -->
    <line x1="260" y1="295" x2="318" y2="295" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>
    <!-- mask + label "first fumigation" -->
    <rect x="244" y="278" width="92" height="12" rx="2" fill="#f0f4f1"/>
    <text x="290" y="287" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIRST FUMIG.</text>

    <!-- ok -> due_soon -->
    <line x1="540" y1="295" x2="598" y2="295" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>
    <rect x="540" y="278" width="60" height="12" rx="2" fill="#f0f4f1"/>
    <text x="570" y="287" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIME</text>

    <!-- due_soon -> overdue -->
    <line x1="760" y1="295" x2="818" y2="295" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr-muted)"/>
    <rect x="745" y="278" width="90" height="12" rx="2" fill="#f0f4f1"/>
    <text x="790" y="287" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">7 DAYS LATE</text>

    <!-- ============================================================ -->
    <!-- SELF-LOOPS (small arcs above each state)                      -->
    <!-- ============================================================ -->
    <!-- no_history self-loop (only fires if "no history" persists; rare, no event) -->
    <!-- skip; no_history is only entered at start -->

    <!-- ok self-loop -->
    <path d="M 400,260 C 400,210 480,210 480,260" fill="none"
          stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-muted)"/>
    <text x="440" y="225" fill="#7a8399" font-size="7"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">tick</text>

    <!-- due_soon self-loop -->
    <path d="M 620,260 C 620,210 700,210 700,260" fill="none"
          stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-muted)"/>
    <text x="660" y="225" fill="#7a8399" font-size="7"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">tick</text>

    <!-- overdue self-loop -->
    <path d="M 840,260 C 840,210 920,210 920,260" fill="none"
          stroke="#a93232" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-muted)"/>
    <text x="880" y="225" fill="#a93232" font-size="7"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">tick</text>

    <!-- ============================================================ -->
    <!-- START INDICATOR                                                -->
    <!-- ============================================================ -->
    <circle cx="68" cy="295" r="6" fill="#1a2e22"/>

    <!-- ============================================================ -->
    <!-- STATES                                                         -->
    <!-- ============================================================ -->
    <!-- no_history (left) -->
    <rect x="120" y="260" width="140" height="70" rx="8"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="190" y="288" fill="#1a2e22" font-size="13" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">no_history</text>
    <text x="190" y="306" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">lastFumigation IS NULL</text>
    <text x="190" y="320" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">diffDays = n/a</text>

    <!-- ok (top center-left) -->
    <rect x="320" y="260" width="180" height="70" rx="8"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="410" y="288" fill="#1a2e22" font-size="13" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">ok</text>
    <text x="410" y="306" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">diffDays &lt; 0</text>
    <text x="410" y="320" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">next_due_date está en el futuro</text>

    <!-- due_soon (center-right) -->
    <rect x="560" y="260" width="200" height="70" rx="8"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="660" y="288" fill="#1a2e22" font-size="13" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">due_soon</text>
    <text x="660" y="306" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">0 &le; diffDays &le; 6</text>
    <text x="660" y="320" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">vencida hace menos de 1 semana</text>

    <!-- overdue (right) — FOCAL with concern color -->
    <rect x="820" y="260" width="180" height="70" rx="8"
          fill="rgba(169,50,50,0.08)" stroke="#a93232" stroke-width="1.4"/>
    <text x="910" y="288" fill="#a93232" font-size="13" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">overdue</text>
    <text x="910" y="306" fill="#a93232" font-size="9" opacity="0.85"
          font-family="'Geist Mono', monospace" text-anchor="middle">diffDays &ge; 7</text>
    <text x="910" y="320" fill="#a93232" font-size="8" opacity="0.75"
          font-family="'Geist Mono', monospace" text-anchor="middle">vencida hace 1+ semana</text>

    <!-- ============================================================ -->
    <!-- GUARD ANNOTATION                                               -->
    <!-- ============================================================ -->
    <line x1="80" y1="430" x2="1120" y2="430" stroke="rgba(26,46,34,0.10)" stroke-width="0.5" stroke-dasharray="2,3"/>
    <text x="600" y="458" fill="#4f5d75" font-size="9" font-weight="500"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GUARD · diffDays = floor((now - next_due_date) / 86_400_000)</text>
    <text x="600" y="478" fill="#4f5d75" font-size="9" font-weight="500"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">next_due_date = lastFumigation + recommended_cadence_days</text>

    <!-- Editorial callout -->
    <text x="600" y="520" fill="#4f5d75" font-size="11" font-style="italic"
          font-family="'Instrument Serif', serif" text-anchor="middle">
      El estado <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="10" fill="#a93232">overdue</tspan> es el que dispara la alerta visual y la página <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="10" fill="#1a2e22">/parcels/overdue</tspan>.
    </text>
  </svg>

  <div class="legend">
    <span class="eyebrow" style="margin-right: 8px;">Leyenda</span>
    <div class="legend-item"><span class="swatch swatch--state"></span> Estado normal</div>
    <div class="legend-item"><span class="swatch swatch--focal"></span> Estado focal · <code style="font-family:'Geist Mono',monospace">overdue</code> (alerta)</div>
    <div class="legend-item">→ tiempo &nbsp; ┄→ tick (self-loop) &nbsp; → nueva fumigación (recovery)</div>
  </div>
</body>
</html>
