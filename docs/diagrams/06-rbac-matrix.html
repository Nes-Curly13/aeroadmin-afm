  <h1>RBAC Matrix — páginas × roles</h1>
  <p class="subtitle">El gate es server-side (<code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">auth()</code> + role check en cada server component). Un curl sin cookie nunca ve la página — no es solo CSS condicional.</p>

      la acción del server-side gate: ✓ view (allow), 404 (notFound),

      El server usa auth() + role check; nunca display:none.
