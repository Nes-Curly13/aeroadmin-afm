<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AeroAdmin AFM — Page Hierarchy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:        #f0f4f1;
      --paper-2:      #e6ede8;
      --ink:          #1a2e22;
      --muted:        #4f5d75;
      --soft:         #7a8399;
      --rule:         rgba(26,46,34,0.12);
      --rule-solid:   #d2ddd6;
      --accent:       #0b5f2d;
      --accent-tint:  rgba(11,95,45,0.08);
      --link:         #2e5aa8;
      --concern:      #a93232;
    }
    html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      padding: 40px 32px 56px;
      max-width: 1280px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 1.75rem;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft);
    }
    .legend {
      margin-top: 24px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      border-top: 1px solid var(--rule);
      padding-top: 16px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .swatch {
      width: 18px; height: 10px; border-radius: 2px;
      border: 1px solid var(--ink);
    }
    .swatch--leaf   { background: #ffffff; border-color: var(--ink); }
    .swatch--focal  { background: var(--accent-tint); border-color: var(--accent); border-width: 1.2px; }
  </style>
</head>
<body>
  <h1>Page Hierarchy — Next.js App Router</h1>
  <p class="subtitle">Estructura de <code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">app/</code>. Cada Server Component es un nodo; los route handlers (<code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">/api/*</code>) viven aparte. El nodo focal <code style="font-family:'Geist Mono',monospace;background:rgba(26,46,34,0.05);padding:1px 5px;border-radius:3px">/parcelas/[id]</code> es el único con rutas anidadas (timeline).</p>

  <svg viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="tree-title tree-desc">
    <title id="tree-title">AeroAdmin AFM — Page Hierarchy</title>
    <desc id="tree-desc">
      Árbol de 3 niveles bajo el root app/. Tier 1: 5 grupos (Home, Map,
      Parcels, History, Admin) + 1 hoja Auth (/login). Tier 2: 10 páginas.
      Tier 3: 1 nieto (/parcelas/[id]/timeline). Foco en /parcelas/[id]
      (la única con rutas anidadas, el "centro de gravedad" del producto).
    </desc>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f0f4f1"/>

    <!-- ============================================================ -->
    <!-- CONNECTORS (drawn before nodes)                                -->
    <!-- ============================================================ -->
    <!-- Root (x=700) -> Tier 1 bus (y=130) -->
    <line x1="700" y1="110" x2="700" y2="130" stroke="#4f5d75" stroke-width="1"/>
    <!-- Tier 1 bus: from x=100 (Home) to x=1200 (Admin) and x=1300 (Auth) -->
    <line x1="100" y1="130" x2="1300" y2="130" stroke="#4f5d75" stroke-width="1"/>
    <line x1="100" y1="130" x2="100" y2="180" stroke="#4f5d75" stroke-width="1"/>
    <line x1="300" y1="130" x2="300" y2="180" stroke="#4f5d75" stroke-width="1"/>
    <line x1="540" y1="130" x2="540" y2="180" stroke="#4f5d75" stroke-width="1"/>
    <line x1="800" y1="130" x2="800" y2="180" stroke="#4f5d75" stroke-width="1"/>
    <line x1="1080" y1="130" x2="1080" y2="180" stroke="#4f5d75" stroke-width="1"/>
    <line x1="1300" y1="130" x2="1300" y2="180" stroke="#4f5d75" stroke-width="1"/>

    <!-- Home (x=100): children at (60, 320) and (160, 320) -->
    <line x1="100" y1="230" x2="100" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="60" y1="280" x2="160" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="60" y1="280" x2="60" y2="320" stroke="#4f5d75" stroke-width="1"/>
    <line x1="160" y1="280" x2="160" y2="320" stroke="#4f5d75" stroke-width="1"/>

    <!-- Map (x=300): 1 child at (300, 320) -->
    <line x1="300" y1="230" x2="300" y2="320" stroke="#4f5d75" stroke-width="1"/>

    <!-- Parcels (x=540): 3 children at (420, 320), (540, 320), (660, 320) -->
    <line x1="540" y1="230" x2="540" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="420" y1="280" x2="660" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="420" y1="280" x2="420" y2="320" stroke="#4f5d75" stroke-width="1"/>
    <line x1="540" y1="280" x2="540" y2="320" stroke="#4f5d75" stroke-width="1"/>
    <line x1="660" y1="280" x2="660" y2="320" stroke="#4f5d75" stroke-width="1"/>

    <!-- History (x=800): 2 children at (760, 320) and (900, 320) -->
    <line x1="800" y1="230" x2="800" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="760" y1="280" x2="900" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="760" y1="280" x2="760" y2="320" stroke="#4f5d75" stroke-width="1"/>
    <line x1="900" y1="280" x2="900" y2="320" stroke="#4f5d75" stroke-width="1"/>

    <!-- Admin (x=1080): 2 children at (1040, 320) and (1180, 320) -->
    <line x1="1080" y1="230" x2="1080" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="1040" y1="280" x2="1180" y2="280" stroke="#4f5d75" stroke-width="1"/>
    <line x1="1040" y1="280" x2="1040" y2="320" stroke="#4f5d75" stroke-width="1"/>
    <line x1="1180" y1="280" x2="1180" y2="320" stroke="#4f5d75" stroke-width="1"/>

    <!-- Tier 2 to Tier 3: /parcelas/[id] (FOCAL, x=540) -> /parcelas/[id]/timeline (x=540, y=440) -->
    <line x1="540" y1="370" x2="540" y2="440" stroke="#0b5f2d" stroke-width="1.4"/>

    <!-- DEPRECATED redirect annotation: /history (x=900) -> annotation below -->
    <line x1="900" y1="370" x2="900" y2="400" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- ============================================================ -->
    <!-- ROOT                                                           -->
    <!-- ============================================================ -->
    <rect x="600" y="60" width="200" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="1.2"/>
    <text x="700" y="83" fill="#1a2e22" font-size="14" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">AeroAdmin</text>
    <text x="700" y="100" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">app/ · Next.js App Router</text>

    <!-- ============================================================ -->
    <!-- TIER 1: 5 groups + 1 Auth (separate)                           -->
    <!-- ============================================================ -->
    <!-- Home (x=100) -->
    <rect x="40" y="180" width="120" height="50" rx="6"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="100" y="203" fill="#1a2e22" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Home</text>
    <text x="100" y="220" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">auth + dashboard</text>

    <!-- Map (x=300) -->
    <rect x="240" y="180" width="120" height="50" rx="6"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="300" y="203" fill="#1a2e22" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Map</text>
    <text x="300" y="220" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">/geovisor</text>

    <!-- Parcels (x=540) -->
    <rect x="480" y="180" width="120" height="50" rx="6"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="540" y="203" fill="#1a2e22" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Parcels</text>
    <text x="540" y="220" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">inventario + detalle</text>

    <!-- History (x=800) -->
    <rect x="740" y="180" width="120" height="50" rx="6"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="800" y="203" fill="#1a2e22" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">History</text>
    <text x="800" y="220" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">task-history + legacy</text>

    <!-- Admin (x=1080) -->
    <rect x="1020" y="180" width="120" height="50" rx="6"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1"/>
    <text x="1080" y="203" fill="#1a2e22" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Admin</text>
    <text x="1080" y="220" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">role-gated</text>

    <!-- Auth (x=1300) - separate leaf for /login -->
    <rect x="1240" y="180" width="120" height="50" rx="6"
          fill="rgba(26,46,34,0.05)" stroke="#1a2e22" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="1300" y="203" fill="#1a2e22" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Auth</text>
    <text x="1300" y="220" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">/login</text>

    <!-- ============================================================ -->
    <!-- TIER 2: 10 pages                                               -->
    <!-- ============================================================ -->
    <!-- Home children: / and /login -->
    <rect x="20" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="60" y="343" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/</text>
    <text x="60" y="360" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">page.tsx</text>

    <rect x="120" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="160" y="343" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/login</text>
    <text x="160" y="360" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">actions.ts</text>

    <!-- Map child: /geovisor -->
    <rect x="260" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="300" y="343" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/geovisor</text>
    <text x="300" y="360" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">MapPageClient</text>

    <!-- Parcels children: /parcelas, /parcelas/[id] (FOCAL), /parcelas/overdue -->
    <rect x="380" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="420" y="343" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/parcelas</text>
    <text x="420" y="360" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle">list</text>

    <rect x="500" y="320" width="80" height="50" rx="6"
          fill="rgba(11,95,45,0.08)" stroke="#0b5f2d" stroke-width="1.4"/>
    <text x="540" y="343" fill="#0b5f2d" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/parcelas/[id]</text>
    <text x="540" y="360" fill="#0b5f2d" font-size="8" opacity="0.80"
          font-family="'Geist Mono', monospace" text-anchor="middle">detail</text>

    <rect x="620" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="660" y="343" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/parcelas/</text>
    <text x="660" y="358" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">overdue</text>

    <!-- History children: /task-history, /history (deprecated) -->
    <rect x="720" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="760" y="343" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/task-</text>
    <text x="760" y="358" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">history</text>

    <rect x="860" y="320" width="80" height="50" rx="6"
          fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="900" y="343" fill="#7a8399" font-size="11" font-weight="500"
          font-family="'Geist Mono', monospace" text-anchor="middle" text-decoration="line-through">/history</text>
    <text x="900" y="360" fill="#a93232" font-size="8" font-weight="500"
          font-family="'Geist Mono', monospace" text-anchor="middle">DEPRECATED</text>

    <!-- Admin children: /devices, /admin/orphan-fumigations -->
    <rect x="1000" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="1040" y="343" fill="#1a2e22" font-size="11" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/devices</text>
    <text x="1040" y="360" fill="#a93232" font-size="7" font-weight="500"
          font-family="'Geist Mono', monospace" text-anchor="middle">admin only</text>

    <rect x="1140" y="320" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="1180" y="338" fill="#1a2e22" font-size="9" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/admin/</text>
    <text x="1180" y="351" fill="#1a2e22" font-size="9" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">orphan-</text>
    <text x="1180" y="364" fill="#1a2e22" font-size="9" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">fumigations</text>

    <!-- ============================================================ -->
    <!-- TIER 3: 1 grandchild                                           -->
    <!-- ============================================================ -->
    <rect x="500" y="440" width="80" height="50" rx="6"
          fill="#ffffff" stroke="#1a2e22" stroke-width="0.8"/>
    <text x="540" y="463" fill="#1a2e22" font-size="10" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">/parcelas/</text>
    <text x="540" y="475" fill="#1a2e22" font-size="10" font-weight="600"
          font-family="'Geist Mono', monospace" text-anchor="middle">[id]/timeline</text>

    <!-- DEPRECATED redirect annotation -->
    <text x="900" y="416" fill="#7a8399" font-size="8" font-style="italic"
          font-family="'Instrument Serif', serif" text-anchor="middle">redirects → /task-history</text>
    <text x="900" y="430" fill="#7a8399" font-size="8" font-style="italic"
          font-family="'Instrument Serif', serif" text-anchor="middle">(next.config.js)</text>

    <!-- Editorial callout -->
    <text x="700" y="600" fill="#4f5d75" font-size="11" font-style="italic"
          font-family="'Instrument Serif', serif" text-anchor="middle">
      La única ruta con anidamiento real es <tspan font-style="normal" font-family="'Geist Mono', monospace" font-size="10" fill="#0b5f2d">/parcelas/[id]/timeline</tspan> — todo lo demás es plano.
    </text>
  </svg>

  <div class="legend">
    <span class="eyebrow" style="margin-right: 8px;">Leyenda</span>
    <div class="legend-item"><span class="swatch swatch--leaf"></span> Página / Grupo</div>
    <div class="legend-item"><span class="swatch swatch--focal"></span> Página focal · <code style="font-family:'Geist Mono',monospace">/parcelas/[id]</code></div>
    <div class="legend-item" style="color:#a93232"><span class="swatch" style="background:rgba(169,50,50,0.05);border-color:rgba(169,50,50,0.40)"></span> role-gated (admin)</div>
    <div class="legend-item" style="color:#7a8399"><span class="swatch" style="background:rgba(79,93,117,0.10);border-color:#7a8399;border-style:dashed"></span> DEPRECATED</div>
  </div>
</body>
</html>
