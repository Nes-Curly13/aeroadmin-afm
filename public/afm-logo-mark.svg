<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40" role="img" aria-label="AFM">
  <title>AFM — AeroAdmin Fumigación Marker</title>
  <!--
    Logo compacto (horizontal, 120x40) para usar en espacios angostos
    (sidebar dark 288px, top header, badges, favicon).

    v2.7.2 (2026-08-22): reemplazado `fill` hardcoded (#0b5f2d verde
    oscuro, invisible contra bg-sidebar dark) por `currentColor` para
    heredar el color del texto del contenedor. Funciona en cualquier
    theme: sidebar dark → texto claro, fondo claro → texto oscuro.

    La letra F usa #84cc16 (lime-500) como acento — color brand
    vibrante que se ve tanto en sidebar dark (#0f1713) como en
    fondo claro (#faf8f2).
  -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">
    <text x="0" y="30" fill="currentColor">A</text>
    <text x="36" y="30" fill="#84cc16">F</text>
    <text x="64" y="30" fill="currentColor">M</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8" letter-spacing="2" opacity="0.7">
    <text x="0" y="40" text-transform="uppercase" fill="currentColor">Fumigación</text>
  </g>
</svg>
