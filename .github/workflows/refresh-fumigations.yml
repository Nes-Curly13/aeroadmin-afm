name: refresh-fumigations

# Cron semanal para refrescar los datos derivados de fumigaciones
# (dji_fumigations + dji_fumigation_schedule) sin re-scrapear DJI.
#
# Cierra el hallazgo del audit ui-ux-2026-07 §9: la BD se actualizaba
# solo cuando se corría el backfill a mano, dejando el panel con
# data stale 24-48h.
#
# Ver scripts/refresh-fumigations.js para el detalle del script.

# =====================================================================
# ACTIVACIÓN (sprint 2026-08-22 — chore/disable-failing-cron-workflows):
#   SCHEDULE DESHABILITADO — el workflow fallaba cada lunes 06:00 UTC
#   porque ni DATABASE_URL ni DATABASE_URL_DIRECT están configurados
#   como secrets del repo. Sin esos, el script aborta con "DATABASE_URL
#   is not configured" y el run queda en estado failure recurrente en
#   el panel de Actions del repo (ruido + falsa alarma).
#
#   Para reactivar el schedule:
#     1. Settings → Secrets and variables → Actions → New repository secret
#     2. DATABASE_URL: connection string de Supabase (puerto 6543 pooled)
#     3. Opcional: DATABASE_URL_DIRECT (puerto 5432 direct) como fallback
#     4. Restaurar el bloque `on:` con el schedule original (reemplaza
#        el `on:` actual que solo tiene workflow_dispatch)
#
#   Mientras tanto, el workflow sigue disponible para dispatch manual
#   (útil después de un backfill grande o un fix de datos).
# =====================================================================

on:
  # Manual only. Ver comentario arriba. Restaurar el bloque con
  # `schedule: - cron: "0 6 * * 1"` cuando se configuren los secrets.
  workflow_dispatch:

# Sin permisos especiales — solo lee el repo y corre un script.
permissions:
  contents: read

concurrency:
  # Si el cron y un workflow_dispatch se solapan, prioriza el dispatch manual
  # (cancela el run del cron en curso).
  group: refresh-fumigations
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh dji_fumigations + dji_fumigation_schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # IMPORTANTE: este workflow requiere el secret `DATABASE_URL`
      # (o `DATABASE_URL_DIRECT`) configurado en el repo. Si no está,
      # el script falla con "DATABASE_URL is not configured" y el cron
      # queda silenciosamente roto. Para producción:
      #   gh secret set DATABASE_URL --repo <owner>/<repo>
      # (valor = connection string de Supabase, formato
      #  postgresql://postgres:password@host:port/db)
      - name: Verify DATABASE_URL is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error::Neither DATABASE_URL nor DATABASE_URL_DIRECT secret is configured. Add one in repo Settings → Secrets."
            exit 1
          fi

      - name: Run refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DATABASE_SSL: ${{ vars.DATABASE_SSL || 'true' }}
        run: node scripts/refresh-fumigations.js
