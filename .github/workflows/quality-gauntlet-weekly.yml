# Quality Gauntlet — workflow semanal para compuertas fase 4-5.
# No corre por-PR (son lentas y más útiles como señal de tendencia).
# Ver docs/QUALITY_GAUNTLET.md §1 (las 7 compuertas) y §4 (cómo extender).
#
# Trigger original: lunes 6am Colombia + workflow_dispatch para correr manual.
# Fases representadas:
#   - Fase 4: mutation testing sobre los 5 módulos críticos.
#   - Fase 5: knip (código muerto) + jscpd (duplicación) — chequeo semanal.
#
# Estado actual (2026-08-22): fase 1+2 activas (lint+arch+coverage) en CI por-PR.
# Las fases 4-5 (este workflow) están DESHABILITADAS vía `if: false` en cada
# job hasta que:
#   1. StrykerJS esté instalado y stable
#   2. Los 106 archivos no usados (knip) se hayan limpiado o documentado
#   3. Los umbrales por archivo estén definidos

name: Quality Gauntlet — weekly

# =====================================================================
# ACTIVACIÓN (sprint 2026-08-22 — chore/disable-failing-cron-workflows):
#   SCHEDULE DESHABILITADO — el workflow fallaba cada lunes 11:00 UTC con
#   106 archivos no usados de knip + threshold issue en
#   `lib/djiag-circuit-breaker.js:245:3`. El job `quality-metrics` tiene
#   `continue-on-error: true` así que NO bloquea, pero el run sigue
#   apareciendo en rojo en el panel de Actions.
#
#   Para reactivar el schedule:
#     1. Limpiar los 106 archivos no usados (o ajustar knip.json para
#        excluirlos con justificación)
#     2. Resolver el DEFAULT_FAILURE_THRESHOLD en djiag-circuit-breaker
#     3. Restaurar el bloque `on:` con `schedule: - cron: "0 11 * * 1"`
#        debajo del nombre
#     4. Sacar el `if: false` del job que se quiera activar
#
#   Mientras tanto, queda disponible para dispatch manual vía la UI de
#   Actions (útil para ver el estado de knip + jscpd sin esperar al lunes).
# =====================================================================

on:
  # Manual only. Ver comentario arriba. Restaurar el bloque con
  # `schedule: - cron: "0 11 * * 1"` cuando se resuelva knip + circuit-breaker.
  workflow_dispatch:
    # Permite correr manual: Actions → Quality Gauntlet — weekly → Run workflow

permissions:
  contents: read

jobs:
  # ===================================================================
  # FASE 4 — Mutation testing (StrykerJS)
  # ===================================================================
  # Solo sobre los 5 módulos críticos. NO sobre todo el repo (caro).
  # Activar DESPUÉS de tener los umbrales de coverage por archivo
  # estables (ver ADOPTION.md).
  mutation-testing:
    name: stryker (mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Por ahora deshabilitado — Stryker + Vitest runner requieren
    # @stryker-mutator/core y @stryker-mutator/vitest-runner instalados
    # + stryker.config.mjs en raíz. Activar en sprint siguiente.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm install --save-dev @stryker-mutator/core @stryker-mutator/vitest-runner
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: ignore

  # ===================================================================
  # FASE 5 — Métricas de calidad continua (knip + jscpd)
  # ===================================================================
  # Informativo, no bloqueante (continue-on-error). Sirve para detectar
  # tendencia — código muerto, duplicación, exports sin usar.
  quality-metrics:
    name: knip + jscpd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sprint 2026-08-22 — deshabilitado. Falla por 106 archivos no usados
    # de knip + threshold issue en lib/djiag-circuit-breaker.js:245:3.
    # El continue-on-error: true de los steps internos NO bloquea el run,
    # pero el run aparece en rojo en el panel de Actions (falsa alarma).
    # Reactivar con `if: ${{ !false }}` cuando se limpie knip.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: knip (código muerto)
        run: npx knip
        continue-on-error: true
      - name: jscpd (duplicación)
        run: npx jscpd . --min-lines 15 --min-tokens 50 --reporters text --output ./reports/jscpd
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: quality-metrics
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
